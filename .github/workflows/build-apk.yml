name: Build APK & Tests

# 触发条件：代码推送到仓库任意分支时自动执行构建（也可手动触发）
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  # ============ 1. JVM 单元测试（无需模拟器） ============
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/**
          if-no-files-found: ignore

  # ============ 2. 仪表化（Compose UI）测试，需要模拟器 ============
  # 使用 macOS runner：提供原生硬件加速(HVF)，模拟器可在数分钟内启动，
  # 而 GitHub 的 Linux runner 是 VM，无 KVM，软件模拟器启动超过 10 分钟导致超时。
  instrumented-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pre-build androidTest APK
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot -noaudio -no-boot-anim -no-window
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/**
          if-no-files-found: ignore

  # ============ 3. 构建 APK（仅在测试通过后） ============
  build-apk:
    runs-on: ubuntu-latest
    needs: [unit-tests, instrumented-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-optimizer-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
