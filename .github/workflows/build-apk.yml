name: Build APK & Tests

# 触发条件：代码推送到仓库任意分支时自动执行构建（也可手动触发）
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  # ============ 1. 全部测试（JVM 单元测试 + Robolectric 上的 Compose UI 测试） ============
  # 说明：Compose UI 测试在 Robolectric 上运行，无需模拟器。
  # GitHub 托管 runner（Linux 无 KVM / macOS 无 HVF）都不支持模拟器硬件加速，
  # 因此统一用 Robolectric 在 JVM 上执行端到端 UI 测试，稳定可靠。
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run all tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/**
          if-no-files-found: ignore

  # ============ 2. 构建 APK（仅在测试通过后） ============
  build-apk:
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-optimizer-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
